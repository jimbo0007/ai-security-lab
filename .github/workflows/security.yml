name: Security Scan

on:
  push:
    branches:
      - main
      - vulnerable-baseline
  pull_request:

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config p/python --sarif --output semgrep.sarif
